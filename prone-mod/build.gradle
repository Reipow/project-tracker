plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.72-beta'
}

version = '1.0.0'

neoForge {
    version = '21.1.65'

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        pronemod {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}
